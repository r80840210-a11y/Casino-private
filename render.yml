services:
  - type: worker
    name: starfun-bot
    runtime: python
    buildCommand: pip install -r starfun_upgrader_requirements.txt
    startCommand: python starfun_upgrader_bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_BASE
        value: http://67.211.221.152:8888
      - key: ADMIN_IDS
        value: "1780243264"
      - key: SUPPORT_USERNAME
        value: "v1nk_molik"
      - key: DB_PATH
        value: /var/data/starfun.db
    disk:
      name: starfun-data
      mountPath: /var/data
      sizeGB: 1
