services:
  - type: worker
    name: starplay-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_BASE
        value: http://67.211.221.152:8888
      - key: DB_PATH
        value: /opt/render/project/src/bot.db
